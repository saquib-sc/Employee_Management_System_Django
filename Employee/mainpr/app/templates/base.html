<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Employee Management{% endblock %}</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 1040px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      color: var(--primary);
    }

    .btn {
      display: inline-block;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-danger {
      color: var(--danger);
      border-color: #fecaca;
      background: var(--surface);
    }

    .btn-danger:hover {
      background: var(--danger-bg);
    }

    .btn-sm {
      padding: 0.25rem 0.6rem;
      font-size: 0.8rem;
    }

    .messages {
      list-style: none;
      padding: 0.75rem 1rem;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.15rem 1.25rem;
      margin-bottom: 1rem;
    }

    form p {
      margin-bottom: 0.9rem;
    }

    form label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }

    form input[type="text"],
    form input[type="password"],
    form input[type="email"],
    form select,
    form textarea {
      width: 100%;
      max-width: 440px;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    <div class="brand">Employee Management</div>
    <nav>
      {% if user.is_authenticated %}
        <span style="color: var(--muted);">Signed in as <strong style="color: var(--text);">{{ user.username }}</strong></span>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-sm">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-sm">Login</a>
      {% endif %}
    </nav>
  </header>

  {% if messages %}
    {% for message in messages %}
      <div class="messages" role="status">
        <span>{{ message }}</span>
        <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;color:inherit;font-weight:bold;">&times;</button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
